[project]
name = "campus-rag-backend"
version = "0.1.0"
description = "CampusRAG backend — F12 persistence layer subset"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "email-validator==2.2.0",
    "anyio==4.7.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",  # passlib 1.7.4 doesn't support bcrypt>=4.1 (removed __about__.__version__)
    "httpx==0.28.1",  # also used directly by app.ingestion.downloader (F1)
    # --- shared LangChain core (F1 loaders, F3 LCEL, F6 cross-encoder) ---
    "langchain-community==0.4.2",  # document loaders (F1) + HuggingFaceCrossEncoder (F6)
    "langchain-core==1.4.9",       # Document schema
    "aiofiles==25.1.0",
    "tenacity==9.1.4",
    "structlog==26.1.0",
    # The document-parsing stack (unstructured, pymupdf, python-docx/pptx, openpyxl, pandas, bs4,
    # lxml) lives in the `ingestion` extra, NOT here — see the note on that extra below.
    # --- Chunking & Indexing (F2) ---
    "tiktoken==0.13.0",
    "rank-bm25==0.2.2",
    "langchain-text-splitters==1.1.2",
    "langchain-openai==1.3.5",
    "langchain-pinecone==0.2.13",
    # --- Baseline RAG chain (F3) ---
    # langchain-core (LCEL: RunnableLambda, ChatPromptTemplate, StrOutputParser) is already
    # pinned above under F1 ingestion — reused, not re-pinned.
    # langfuse lives in the `serving` extra — see the note there.
    # --- Evaluation harness (F4) ---
    # RAGAS judge suite. 0.4.3 resolves cleanly against langchain-core 1.4.9 (no downgrade), but its
    # `ragas.llms.base` unconditionally imports `langchain_community.chat_models.vertexai`, a path the
    # sunset langchain-community 0.4.2 no longer ships. We never use Vertex (judge is ChatOpenAI), so
    # app/evals/_ragas_compat.py installs a one-module sys.modules shim before importing ragas — the
    # "isolate" half of the required-dep decision. Pulls datasets/langgraph/scipy transitively; the
    # transitive langgraph is NOT the CLAUDE.md v2 "LangGraph routing" stretch item, just a ragas dep.
    "ragas==0.4.3",
    # --- Reranking (F6) ---
    # Cross-encoder rerank of F5's fused top-12 → top-5 (cross-encoder/ms-marco-MiniLM-L-6-v2 via
    # HuggingFaceCrossEncoder). sentence-transformers pulls torch + transformers + huggingface-hub.
    # torch is pinned to the CPU-compatible release; F15's Docker build installs the CPU wheel via
    # the PyTorch CPU index (`--index-url https://download.pytorch.org/whl/cpu`) and pre-downloads
    # the model weights (`HF_HUB_OFFLINE=1` at runtime) so there is no runtime network dependency.
    "sentence-transformers==5.6.0",
    "torch==2.13.0",
    # `langchain` (ships `langchain_classic`, which provides CrossEncoderReranker +
    # ContextualCompressionRetriever) is used ONLY for the demonstrable LangChain API surface
    # (rerank.build_compression_retriever) — never on the runtime path (design.md §2).
    "langchain==1.3.13",
    # --- Semantic cache (F9) ---
    # Redis hot tier. `redis.asyncio` only — the sync client is banned by the async mandate and by
    # the `caching:` CI job's guard. Upstash-compatible (plain RESP over TLS), so the same client
    # serves local docker `redis:7` and the prod free tier.
    "redis==5.2.1",
    # F9's cosine matmul over the cached-embedding matrix is the first DIRECT numpy import in
    # `app/` (it arrived transitively via torch/pandas/ragas until now), so it gets pinned here
    # rather than relied on as someone else's transitive dep.
    "numpy==2.4.6",
    # --- Auth (F10) ---
    # passlib[bcrypt]==1.7.4 + bcrypt==4.0.1 are already pinned above (F12) and reused as-is. That
    # bcrypt pin is load-bearing: passlib reads `bcrypt.__about__.__version__`, which bcrypt>=4.1
    # removed, and the failure surfaces as a bogus "password cannot be longer than 72 bytes" on
    # every hash call.
    "pyjwt==2.10.1",
    # Required by OAuth2PasswordRequestForm — FastAPI parses the password grant as form data, and
    # without this /token raises at import rather than failing cleanly.
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
# --- The serving / ingestion split (F15) ------------------------------------
# This split originally existed because langfuse 2.60.9 (wrapt<2.0) and unstructured 0.24.1
# (wrapt>=2.1.1) could never be co-installed. That conflict is GONE at langfuse 4 (wrapt>=1.14,<3,
# which overlaps unstructured's range) — the two now coexist happily, and they must, because the
# local dev venv runs both the app and the test suite.
#
# The split is kept anyway, for the other reason F15 introduced it: no single environment needs
# both, and separating them strips spacy/numba/nltk out of the serving image.
#   * the serving app never imports app.ingestion or unstructured (verified with an import graph
#     from app.main) — it only wants langfuse;
#   * ingestion wants the parsing stack and never emits a Langfuse trace.
serving = [
    # optional at runtime — observability.langfuse_config() returns {} when it is absent.
    # v4 is a hard floor, not a preference: the v2 API this code used (`langfuse.callback`,
    # credentials as CallbackHandler kwargs) does not exist here, and v2 predates LangChain 1.x.
    "langfuse==4.14.2",
]
ingestion = [
    "unstructured[docx,pptx,xlsx,md]==0.24.1",
    "pymupdf==1.28.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "pandas==2.3.3",  # xlsx row-wise iteration + fixture generation
    # ocrmypdf / libreoffice are external CLI binaries invoked via subprocess in the Docker
    # ingestion image (design.md §3) — not Python-importable deps, not installed here.
]

dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.1",  # F15: the `types` CI gate, basic mode (see [tool.mypy])
    "types-aiofiles==24.1.0.20241221",  # real stubs beat `ignore_missing_imports` for aiofiles
]
# F15 load test. A separate extra, not `dev`: locust pulls flask/gevent/geventhttpclient, none of
# which belong in the CI test jobs or anywhere near the serving image.
load = [
    "locust==2.32.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
# "Basic mode" (F15 AC-23), deliberately not --strict: `disallow_untyped_defs` over a codebase
# this size is a refactor, not a deployment feature. This config catches the errors that are
# actually bugs — wrong argument types, bad attribute access, None misuse — inside function
# bodies that already carry annotations.
python_version = "3.11"
check_untyped_defs = true
# ragas, langfuse, sentence-transformers, rank_bm25 and pinecone ship no usable stubs. Without
# this every import of them is an error and the gate becomes noise nobody reads.
ignore_missing_imports = true
# A blanket `ignore_errors` is forbidden — it makes the gate decorative. Any escape hatch goes in
# its own [[tool.mypy.overrides]] block below with a one-line reason.
exclude = "(^app/db/migrations/versions/|_pycache_)"

# torch, transformers and sentence-transformers ship `py.typed`, so mypy type-checks the whole of
# each of them on the way through our two import sites. Measured: 20+ minutes and 2.4GB RSS before
# it was killed, versus seconds with this. `skip` treats them as Any at the boundary — which is all
# they were ever going to be here, since the calls are `CrossEncoder(...).predict(...)`.
[[tool.mypy.overrides]]
module = [
    "torch.*",
    "transformers.*",
    "sentence_transformers.*",
    "ragas.*",
    "datasets.*",
]
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
